# Baseline B0: Bicubic Interpolation
# No learning - simple bicubic 2x upscaling

run_id: B0_BICUBIC
model:
  name: bicubic
  scale: 2

data:
  noisy_dir: data/extracted/train/NoisyLR
  gt_dir: data/extracted/train/GT
  test_dir: data/extracted/test/NoisyLR
  splits_dir: data/splits

evaluation:
  output_dir: outputs/bicubic
  metrics:
    - psnr
    - ssim
    - lpips
