# B2: compact NAFNet-style architecture baseline.
# This initial schedule matches B1 for a controlled architecture comparison.

run_id: B2_NAFNET_SR_BASELINE

model:
  name: nafnet_sr
  in_channels: 1
  out_channels: 1
  feature_width: 32
  num_blocks: 8
  expansion_factor: 2
  attention_reduction_factor: 4
  residual_scale: 0.1
  layer_norm_eps: 0.000001
  upsampling_method: pixelshuffle

data:
  noisy_dir: data/extracted/train/NoisyLR
  gt_dir: data/extracted/train/GT
  test_dir: data/extracted/test/NoisyLR
  splits_dir: data/splits
  train_split: data/splits/train.txt
  val_split: data/splits/val.txt
  dev_test_split: data/splits/dev_test.txt

training:
  seed: 42
  epochs: 3
  batch_size: 16
  num_workers: 0
  augment: true

  optimizer:
    name: adam
    lr: 0.001
    weight_decay: 0.0
    betas: [0.9, 0.999]

  scheduler:
    name: cosine
    T_max: 3
    eta_min: 0.0001

  loss:
    name: charbonnier
    epsilon: 0.001

  amp: true
  gradient_clip: 1.0

checkpoint:
  dir: checkpoints
  path: checkpoints/baseline_nafnet_best.pth
  save_every: 1
  filename: baseline_nafnet
  best_filename: baseline_nafnet_best.pth

evaluation:
  output_dir: outputs/nafnet_sr
  save_images: true
  max_save: 20
  metrics:
    - psnr
    - ssim
    - lpips

logging:
  experiment_log: docs/experiment_log.csv
